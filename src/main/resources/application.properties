# ======================================================
# Application
# ======================================================
spring.application.name=erp-system
server.port=8080
server.servlet.context-path=/api


# ======================================================
# Database - PostgreSQL
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/erp_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Explicit)
spring.datasource.hikari.pool-name=HikariPool-ERP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED


# ======================================================
# JPA / Hibernate
# ======================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ======================================================
# Flyway (DB Migration)
# ======================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ======================================================
# Logging
# ======================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ======================================================
# Jackson (JSON)
# ======================================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false


# ======================================================
# Security - JWT (BASIC CONFIG)
# ======================================================
security.jwt.secret=erp-secret-key-please-change
security.jwt.expiration-ms=3600000
security.jwt.refresh-expiration-ms=86400000


# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
